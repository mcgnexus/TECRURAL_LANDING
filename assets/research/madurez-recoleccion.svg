<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Esquema TecRural: Muestreo de fruto → Indicadores de calidad → Ventana de cosecha</title><desc id="desc">Seguir cambios de madurez con muestras y referencias repetidas. Diagrama conceptual; proceso sujeto a validación en campo.</desc><rect width="960" height="390" rx="26" fill="#edf2e5"/><rect x="24" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="44" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">1 · OBSERVAR</text><g transform="translate(69 82)" stroke="#245b44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M48 115c0-28 20-46 44-38 15-17 46-8 48 16 27 5 34 37 12 51H68c-12-5-20-16-20-29Z" fill="#dce9c9"/><circle cx="73" cy="111" r="14" fill="#d4a548"/><circle cx="112" cy="111" r="14" fill="#86a958"/><circle cx="151" cy="111" r="14" fill="#765b3a"/><path d="M54 170h113M64 170v-12M91 170v-24M118 170v-36M145 170v-51" stroke="#5a8a4d"/></g><text x="44" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Muestreo de fruto</text><text x="44" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Seguir cambios de madurez con</text><text x="44" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">muestras y referencias repetidas.</text><circle cx="323" cy="194" r="15" fill="#54834c"/><path d="M317 194h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="336" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="356" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">2 · INTERPRETAR</text><g transform="translate(386 94)" fill="none" stroke="#245b44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 125h165M28 113l35-32 29 17 37-54 35 36"/><circle cx="63" cy="81" r="9" fill="#dce9c9"/><circle cx="129" cy="44" r="9" fill="#d4a548"/><path d="M150 44h29M150 66h22M150 88h29"/></g><text x="356" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Indicadores de calidad</text><text x="356" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Se contrasta con condiciones,</text><text x="356" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">historial y medidas de referencia.</text><circle cx="635" cy="194" r="15" fill="#54834c"/><path d="M629 194h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="648" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="668" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">3 · DECIDIR</text><g transform="translate(700 98)" fill="none" stroke="#245b44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 117h170M26 117V89h35v28M76 117V68h35v49M126 117V43h35v74"/><path d="m143 24 18 19-18 19" stroke="#d4a548"/><path d="M45 147h112" stroke="#8ca553"/></g><text x="668" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Ventana de cosecha</text><text x="668" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Se presenta como apoyo práctico,</text><text x="668" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">con sus límites claros.</text></svg>