<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Esquema TecRural: Muestra de aire → Sensor específico → Dato con contexto</title><desc id="desc">Explorar señales de gases para calidad agrícola o seguridad. Diagrama conceptual; proceso sujeto a validación en campo.</desc><rect width="960" height="390" rx="26" fill="#edf2e5"/><rect x="24" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="44" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">1 · OBSERVAR</text><g transform="translate(69 82)" stroke="#245b44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="58" cy="75" r="12" fill="#d4a548"/><circle cx="103" cy="52" r="9" fill="#dce9c9"/><circle cx="149" cy="76" r="13" fill="#dce9c9"/><circle cx="94" cy="119" r="11" fill="#d4a548"/><path d="m69 69 25-13m18 1 26 13M66 85l21 26m19 6 32-28"/><rect x="123" y="117" width="56" height="46" rx="8" fill="#dce9c9"/><path d="M137 117v-14h28v14M134 139h33M148 129v21" stroke="#d4a548"/></g><text x="44" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Muestra de aire</text><text x="44" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Explorar señales de gases para</text><text x="44" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">calidad agrícola o seguridad.</text><circle cx="323" cy="194" r="15" fill="#54834c"/><path d="M317 194h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="336" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="356" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">2 · INTERPRETAR</text><g transform="translate(386 94)" fill="none" stroke="#245b44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 125h165M28 113l35-32 29 17 37-54 35 36"/><circle cx="63" cy="81" r="9" fill="#dce9c9"/><circle cx="129" cy="44" r="9" fill="#d4a548"/><path d="M150 44h29M150 66h22M150 88h29"/></g><text x="356" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Sensor específico</text><text x="356" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Se contrasta con condiciones,</text><text x="356" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">historial y medidas de referencia.</text><circle cx="635" cy="194" r="15" fill="#54834c"/><path d="M629 194h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="648" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="668" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">3 · DECIDIR</text><g transform="translate(700 98)" fill="none" stroke="#245b44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 117h170M26 117V89h35v28M76 117V68h35v49M126 117V43h35v74"/><path d="m143 24 18 19-18 19" stroke="#d4a548"/><path d="M45 147h112" stroke="#8ca553"/></g><text x="668" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Dato con contexto</text><text x="668" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Se presenta como apoyo práctico,</text><text x="668" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">con sus límites claros.</text></svg>