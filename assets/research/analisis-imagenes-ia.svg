<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Esquema TecRural: Foto de la planta → Señales visuales → Revisión asistida</title><desc id="desc">Localizar patrones visibles para orientar una inspección. Diagrama conceptual; proceso sujeto a validación en campo.</desc><rect width="960" height="390" rx="26" fill="#edf2e5"/><rect x="24" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="44" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">1 · OBSERVAR</text><g transform="translate(69 82)" stroke="#245b44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M77 151c-40-16-47-59-19-90 28-29 70-19 85 15-3 36-25 62-66 75Z" fill="#dce9c9"/><path d="M64 130c18-20 38-40 63-59M84 111l-5-29M102 94l26 5"/><rect x="32" y="48" width="50" height="48" rx="8" stroke="#d4a548"/><path d="M154 119l22 22M150 89a29 29 0 1 0 0 58 29 29 0 0 0 0-58Z"/></g><text x="44" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Foto de la planta</text><text x="44" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Localizar patrones visibles para</text><text x="44" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">orientar una inspección.</text><circle cx="323" cy="194" r="15" fill="#54834c"/><path d="M317 194h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="336" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="356" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">2 · INTERPRETAR</text><g transform="translate(386 94)" fill="none" stroke="#245b44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 125h165M28 113l35-32 29 17 37-54 35 36"/><circle cx="63" cy="81" r="9" fill="#dce9c9"/><circle cx="129" cy="44" r="9" fill="#d4a548"/><path d="M150 44h29M150 66h22M150 88h29"/></g><text x="356" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Señales visuales</text><text x="356" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Se contrasta con condiciones,</text><text x="356" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">historial y medidas de referencia.</text><circle cx="635" cy="194" r="15" fill="#54834c"/><path d="M629 194h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="648" y="24" width="288" height="340" rx="20" fill="#ffffff" stroke="#dce5d5" stroke-width="2"/><text x="668" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#748744">3 · DECIDIR</text><g transform="translate(700 98)" fill="none" stroke="#245b44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 117h170M26 117V89h35v28M76 117V68h35v49M126 117V43h35v74"/><path d="m143 24 18 19-18 19" stroke="#d4a548"/><path d="M45 147h112" stroke="#8ca553"/></g><text x="668" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#164b3b">Revisión asistida</text><text x="668" y="310" font-family="Arial,sans-serif" font-size="13" fill="#617168">Se presenta como apoyo práctico,</text><text x="668" y="329" font-family="Arial,sans-serif" font-size="13" fill="#617168">con sus límites claros.</text></svg>